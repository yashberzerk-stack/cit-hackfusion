<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClauseGuard — Full Report</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: radial-gradient(1000px 400px at 20% -10%, #1e1b4b 0%, #0b1120 55%);
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 32px 16px;
      }
      .wrap { max-width: 720px; margin: 0 auto; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #fff; font-size: 15px; }
      .pill { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #a5b4fc; text-transform: uppercase; }
      h1 { font-size: 22px; margin-top: 20px; color: #fff; }
      .sub { color: #94a3b8; font-size: 13px; margin-top: 4px; }
      .card { margin-top: 16px; background: #101a30; border: 1px solid #1f2b45; border-radius: 14px; padding: 18px; }
      .card h2 { font-size: 14px; color: #f1f5f9; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
      .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .meter { background: #16223f; border: 1px solid #1f2b45; border-radius: 10px; padding: 12px; text-align: center; }
      .meter b { display: block; font-size: 20px; color: #fff; margin-top: 6px; }
      .meter span { font-size: 10px; color: #94a3b8; }
      .clause { margin-top: 10px; padding: 12px; border-radius: 10px; font-size: 12px; line-height: 1.5; }
      .error { background: #450a0a; border: 1px solid #7f1d1d; }
      .warn { background: #451a03; border: 1px solid #92400e; }
      .info { background: #0c4a6e; border: 1px solid #075985; }
      .err-title { color: #fca5a5; font-weight: 700; }
      .warn-title { color: #fcd34d; font-weight: 700; }
      .info-title { color: #7dd3fc; font-weight: 700; }
      .plain { margin-top: 6px; color: #e2e8f0; }
      .why { margin-top: 4px; color: #94a3b8; }
      .readability { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
      .read-item { background: #16223f; border: 1px solid #1f2b45; border-radius: 8px; padding: 10px; }
      .read-item .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
      .read-item .value { font-size: 16px; font-weight: 700; color: #fff; margin-top: 4px; }
      .read-item .desc { font-size: 10px; color: #64748b; margin-top: 2px; }
      .score-ring { display: flex; justify-content: center; margin: 16px 0; }
      .score-ring svg { filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.3)); }
      .rec { margin-top: 12px; padding: 12px; border-radius: 10px; background: #16223f; border: 1px solid #1f2b45; font-size: 12px; line-height: 1.5; color: #cbd5e1; }
      .rec b { color: #a5b4fc; }
      .actions { display: flex; gap: 8px; margin-top: 16px; }
      .btn { flex: 1; border: 0; font-weight: 700; font-size: 12px; padding: 10px; border-radius: 8px; cursor: pointer; transition: filter 0.15s; }
      .btn:hover { filter: brightness(1.1); }
      .btn-primary { background: linear-gradient(90deg, #6366f1, #06b6d4); color: #fff; }
      .btn-ghost { background: transparent; border: 1px solid #334155; color: #94a3b8; }
      .footer { margin-top: 24px; text-align: center; color: #475569; font-size: 11px; }
      @media (min-width: 640px) { .meters { grid-template-columns: repeat(4, 1fr); } }
      .loading { text-align: center; padding: 60px 0; color: #64748b; }
      .spinner { width: 32px; height: 32px; border: 3px solid #1e293b; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .paste-area { width: 100%; min-height: 200px; resize: vertical; border-radius: 10px; border: 1px solid #1f2b45; background: #16223f; color: #e2e8f0; padding: 12px; font-size: 13px; font-family: inherit; line-height: 1.5; }
      .paste-area:focus { outline: none; border-color: #6366f1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <span style="width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399"></span>
        ClauseGuard
        <span class="pill">Full Report</span>
      </div>

      <div id="content">
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>Analyzing policy...</p>
        </div>
      </div>

      <p class="footer">ClauseGuard v2.0 — All processing happens on-device · HackFusion 2026</p>
    </div>

    <script src="report.js"></script>
  </body>
</html>
