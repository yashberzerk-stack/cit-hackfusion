<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 380px;
        max-height: 580px;
        overflow-y: auto;
        background: #0b1120;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 16px;
      }

      .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }
      .brand { color: #fff; font-weight: 800; font-size: 14px; }
      .badge { margin-left: auto; color: #818cf8; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

      .url { color: #64748b; font-size: 11px; margin-bottom: 12px; word-break: break-all; }

      .scan-stage { text-align: center; padding: 24px 0; }
      .scan-stage .spinner { width: 32px; height: 32px; border: 3px solid #1e293b; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
      .scan-stage p { color: #94a3b8; font-size: 12px; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .result { animation: slide-up 0.3s ease-out; }
      @keyframes slide-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

      .score-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
      .score-num { font-weight: 800; font-size: 28px; }
      .score-num small { font-size: 10px; color: #94a3b8; font-weight: 600; }
      .bar-wrap { flex: 1; }
      .bar-head { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-bottom: 4px; }
      .bar { height: 5px; border-radius: 99px; background: #1e293b; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 99px; transition: width 0.8s ease; }

      .verdict { display: inline-block; margin: 6px 0 12px; border-radius: 99px; padding: 3px 10px; font-size: 10px; font-weight: 700; }

      .clause { margin-top: 6px; padding: 8px 10px; border-radius: 8px; font-size: 11px; line-height: 1.45; }
      .clause.error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
      .clause.warn { background: #451a03; border: 1px solid #92400e; color: #fcd34d; }
      .clause.info { background: #0c4a6e; border: 1px solid #075985; color: #7dd3fc; }

      .category-row { display: flex; gap: 6px; margin: 10px 0; }
      .cat-item { flex: 1; text-align: center; padding: 6px 4px; background: #16223f; border-radius: 8px; border: 1px solid #1f2b45; }
      .cat-item .cat-score { font-weight: 700; font-size: 14px; }
      .cat-item .cat-label { font-size: 8px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

      .actions { display: flex; gap: 8px; margin-top: 12px; }
      .btn { flex: 1; border: 0; font-weight: 700; font-size: 11px; padding: 9px; border-radius: 8px; cursor: pointer; transition: filter 0.15s; }
      .btn:hover { filter: brightness(1.1); }
      .btn:active { transform: scale(0.98); }
      .btn-primary { background: linear-gradient(90deg, #6366f1, #06b6d4); color: #fff; }
      .btn-ghost { background: transparent; border: 1px solid #334155; color: #94a3b8; }

      .settings-link { display: block; text-align: center; margin-top: 10px; color: #64748b; font-size: 10px; cursor: pointer; text-decoration: underline; }
      .settings-link:hover { color: #94a3b8; }

      .change-alert { background: #7f1d1d; border: 1px solid #dc2626; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 11px; color: #fecaca; }

      .empty { text-align: center; padding: 20px 0; color: #64748b; font-size: 12px; }
      .empty-icon { font-size: 24px; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="dot"></span>
      <span class="brand">ClauseGuard</span>
      <span class="badge">v2.0</span>
    </div>
    <p class="url" id="url">Loading...</p>

    <div id="stage-scan" class="scan-stage">
      <div class="spinner"></div>
      <p>Analyzing this page...</p>
    </div>

    <div id="stage-done" class="result" style="display:none"></div>

    <div id="stage-empty" class="empty" style="display:none">
      <div class="empty-icon">📋</div>
      <p>No policy detected on this page</p>
      <p style="margin-top:4px;font-size:10px;color:#475569">Navigate to a Privacy Policy or Terms of Service page, or paste text in the full analyzer.</p>
    </div>

    <a class="settings-link" id="open-settings">Settings &amp; Risk Profile</a>

    <script src="popup.js"></script>
  </body>
</html>
